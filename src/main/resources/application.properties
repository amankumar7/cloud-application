spring.application.name=CloudApplication
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:8080/mydatabase
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.private-key=C:/filemanager-keys/private-pkcs8.pem
jwt.public-key=C:/filemanager-keys/public.pem
jwt.issuer=cloud-auth-service
jwt.audience=cloud-api
jwt.access-token-expiration=900
jwt.refresh-token-expiration=604800
